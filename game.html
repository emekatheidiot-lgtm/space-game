<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Galaxy Storm</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    background:#020318;
    font-family:Arial,sans-serif;
}

body{
    display:flex;
    justify-content:center;
}

#game{
    display:block;
    width:min(100vw,520px);
    height:100vh;
    background:#070a38;
    touch-action:none;
}

/* ================= SCREENS ================= */

.screen{
    position:fixed;
    inset:0;
    z-index:20;

    display:flex;
    align-items:center;
    justify-content:center;
    flex-direction:column;

    text-align:center;
    color:white;

    background:
        radial-gradient(
            circle at center,
            rgba(60,30,150,.45),
            rgba(0,0,0,.94)
        );
}

.hidden{
    display:none!important;
}

.screen h1{
    font-size:48px;
    color:#65f6ff;

    text-shadow:
        0 0 10px #00eaff,
        0 0 30px #4d4dff,
        0 0 60px #6b00ff;

    margin-bottom:10px;
}

.screen p{
    color:#ddd;
    margin:7px;
}

.mainBtn{
    margin-top:25px;

    border:0;
    border-radius:30px;

    padding:15px 42px;

    font-size:20px;
    font-weight:bold;

    color:white;

    background:
        linear-gradient(
            90deg,
            #00c8ff,
            #7c32ff
        );

    box-shadow:
        0 0 20px #00d9ff,
        0 0 40px rgba(100,30,255,.5);

    cursor:pointer;
}

.mainBtn:hover{
    transform:scale(1.05);
}

#levelText{
    font-size:50px;
    color:#fff;

    text-shadow:
        0 0 20px #00eaff,
        0 0 50px #7744ff;
}

#bossText{
    color:#ff4c68;
    font-size:30px;
    margin-top:15px;

    text-shadow:
        0 0 15px red;
}

/* ================= MOBILE ================= */

#controls{
    position:fixed;
    bottom:18px;
    left:0;
    width:100%;

    display:flex;
    justify-content:center;
    gap:18px;

    z-index:10;

    pointer-events:none;
}

.control{
    width:75px;
    height:62px;

    border:1px solid rgba(255,255,255,.3);
    border-radius:18px;

    background:rgba(30,50,150,.65);

    color:white;

    font-size:28px;

    box-shadow:
        0 0 15px #00cfff;

    pointer-events:auto;

    user-select:none;
    touch-action:none;
}

@media(min-width:700px){

    #controls{
        display:none;
    }

}

</style>
</head>

<body>

<!-- ================= START SCREEN ================= -->

<div id="startScreen" class="screen">

    <h1>🚀 GALAXY STORM</h1>

    <p>
        Destroy the alien fleet!
    </p>

    <p>
        Survive 10 increasingly difficult levels.
    </p>

    <button
        id="startBtn"
        class="mainBtn">

        START GAME

    </button>

</div>


<!-- ================= LEVEL SCREEN ================= -->

<div id="levelScreen" class="screen hidden">

    <div id="levelText">
        LEVEL 1
    </div>

    <div id="bossText"></div>

    <p id="levelDescription">
        Incoming enemy fleet...
    </p>

</div>


<!-- ================= GAME OVER ================= -->

<div id="gameOverScreen" class="screen hidden">

    <h1>GAME OVER</h1>

    <p id="finalScore">
        Score: 0
    </p>

    <p id="finalLevel">
        Level: 1
    </p>

    <button
        id="restartBtn"
        class="mainBtn">

        PLAY AGAIN

    </button>

</div>


<!-- ================= WIN SCREEN ================= -->

<div id="winScreen" class="screen hidden">

    <h1>🏆 VICTORY!</h1>

    <p>
        You destroyed the entire alien fleet!
    </p>

    <p id="winScore">
        Score: 0
    </p>

    <button
        id="winRestart"
        class="mainBtn">

        PLAY AGAIN

    </button>

</div>


<canvas id="game"></canvas>


<!-- ================= CONTROLS ================= -->

<div id="controls">

    <button
        class="control"
        id="left">

        ◀

    </button>

    <button
        class="control"
        id="fire">

        🔥

    </button>

    <button
        class="control"
        id="right">

        ▶

    </button>

</div>


<script>

/* =========================================================
   CANVAS
========================================================= */

const canvas =
    document.getElementById("game");

const ctx =
    canvas.getContext("2d");

let W,H;


/* =========================================================
   GAME STATE
========================================================= */

let running=false;

let level=1;

let score=0;

let lives=3;

let power=1;

let levelTimer=0;

let bossActive=false;

let boss=null;

let transitioning=false;


/* =========================================================
   ARRAYS
========================================================= */

let stars=[];

let enemies=[];

let bullets=[];

let enemyBullets=[];

let particles=[];

let powerUps=[];


/* =========================================================
   INPUT
========================================================= */

const keys={};

let left=false;

let right=false;

let fire=false;


/* =========================================================
   PLAYER
========================================================= */

const player={

    x:0,

    y:0,

    speed:6,

    radius:18,

    invincible:0

};


/* =========================================================
   LEVEL DIFFICULTY
========================================================= */

const levelDifficulty={

    1:{
        hp:1,
        speed:.20,
        shootDelay:150,
        shooters:1,
        bulletSpeed:2.4
    },

    2:{
        hp:1,
        speed:.25,
        shootDelay:135,
        shooters:2,
        bulletSpeed:2.6
    },

    3:{
        hp:2,
        speed:.30,
        shootDelay:120,
        shooters:2,
        bulletSpeed:2.8
    },

    4:{
        hp:2,
        speed:.35,
        shootDelay:105,
        shooters:3,
        bulletSpeed:3.0
    },

    5:{
        hp:3,
        speed:.40,
        shootDelay:95,
        shooters:4,
        bulletSpeed:3.2
    },

    6:{
        hp:3,
        speed:.45,
        shootDelay:85,
        shooters:5,
        bulletSpeed:3.4
    },

    7:{
        hp:4,
        speed:.50,
        shootDelay:75,
        shooters:6,
        bulletSpeed:3.6
    },

    8:{
        hp:4,
        speed:.55,
        shootDelay:65,
        shooters:7,
        bulletSpeed:3.8
    },

    9:{
        hp:5,
        speed:.60,
        shootDelay:55,
        shooters:8,
        bulletSpeed:4.0
    },

    10:{
        hp:6,
        speed:.65,
        shootDelay:48,
        shooters:9,
        bulletSpeed:4.2
    }

};


function getDifficulty(){

    return levelDifficulty[level]
        || levelDifficulty[10];

}


/* =========================================================
   RESIZE
========================================================= */

function resize(){

    W=Math.min(
        window.innerWidth,
        520
    );

    H=window.innerHeight;

    canvas.width=W;

    canvas.height=H;

    player.x=W/2;

    player.y=H-110;

}

window.addEventListener(
    "resize",
    resize
);


/* =========================================================
   STARS
========================================================= */

function createStars(){

    stars=[];

    for(let i=0;i<180;i++){

        stars.push({

            x:Math.random()*W,

            y:Math.random()*H,

            size:
                Math.random()*2+.4,

            speed:
                Math.random()*3+.5,

            alpha:
                Math.random()*.8+.2

        });

    }

}


/* =========================================================
   BACKGROUND
========================================================= */

function drawBackground(){

    const gradient=
        ctx.createLinearGradient(
            0,
            0,
            0,
            H
        );

    gradient.addColorStop(
        0,
        "#10073b"
    );

    gradient.addColorStop(
        .45,
        "#081d59"
    );

    gradient.addColorStop(
        1,
        "#02031b"
    );

    ctx.fillStyle=gradient;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );


    stars.forEach(s=>{

        s.y+=s.speed;

        if(s.y>H){

            s.y=-5;

            s.x=Math.random()*W;

        }

        ctx.globalAlpha=s.alpha;

        ctx.fillStyle="#fff";

        ctx.beginPath();

        ctx.arc(
            s.x,
            s.y,
            s.size,
            0,
            Math.PI*2
        );

        ctx.fill();

    });

    ctx.globalAlpha=1;


    const nebula=
        ctx.createRadialGradient(
            W*.2,
            H*.4,
            10,
            W*.2,
            H*.4,
            W*.8
        );

    nebula.addColorStop(
        0,
        "rgba(100,0,255,.12)"
    );

    nebula.addColorStop(
        1,
        "transparent"
    );

    ctx.fillStyle=nebula;

    ctx.fillRect(
        0,
        0,
        W,
        H
    );

}


/* =========================================================
   PLAYER DRAW
========================================================= */

function drawPlayer(){

    ctx.save();

    ctx.translate(
        player.x,
        player.y
    );


    let flame=
        18+
        Math.random()*18;


    let fireGradient=
        ctx.createLinearGradient(
            0,
            10,
            0,
            65
        );

    fireGradient.addColorStop(
        0,
        "#fff"
    );

    fireGradient.addColorStop(
        .2,
        "#00ffff"
    );

    fireGradient.addColorStop(
        .6,
        "#0066ff"
    );

    fireGradient.addColorStop(
        1,
        "transparent"
    );

    ctx.fillStyle=fireGradient;

    ctx.shadowBlur=20;

    ctx.shadowColor="#00eaff";

    ctx.beginPath();

    ctx.moveTo(-12,20);

    ctx.lineTo(
        0,
        25+flame
    );

    ctx.lineTo(12,20);

    ctx.closePath();

    ctx.fill();


    ctx.fillStyle="#087bca";

    ctx.shadowBlur=18;

    ctx.shadowColor="#00eaff";


    ctx.beginPath();

    ctx.moveTo(-8,-5);

    ctx.lineTo(-48,32);

    ctx.lineTo(-15,24);

    ctx.closePath();

    ctx.fill();


    ctx.beginPath();

    ctx.moveTo(8,-5);

    ctx.lineTo(48,32);

    ctx.lineTo(15,24);

    ctx.closePath();

    ctx.fill();


    let body=
        ctx.createLinearGradient(
            -25,
            0,
            25,
            0
        );

    body.addColorStop(
        0,
        "#13508c"
    );

    body.addColorStop(
        .35,
        "#64ffff"
    );

    body.addColorStop(
        .5,
        "#fff"
    );

    body.addColorStop(
        .65,
        "#64ffff"
    );

    body.addColorStop(
        1,
        "#13508c"
    );

    ctx.fillStyle=body;

    ctx.beginPath();

    ctx.moveTo(0,-45);

    ctx.lineTo(13,-10);

    ctx.lineTo(25,25);

    ctx.lineTo(9,19);

    ctx.lineTo(0,36);

    ctx.lineTo(-9,19);

    ctx.lineTo(-25,25);

    ctx.lineTo(-13,-10);

    ctx.closePath();

    ctx.fill();


    let glass=
        ctx.createRadialGradient(
            0,
            -17,
            2,
            0,
            -17,
            16
        );

    glass.addColorStop(
        0,
        "#fff"
    );

    glass.addColorStop(
        .3,
        "#6fffff"
    );

    glass.addColorStop(
        1,
        "#0750a5"
    );

    ctx.fillStyle=glass;

    ctx.beginPath();

    ctx.ellipse(
        0,
        -17,
        9,
        16,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    if(power>=3){

        ctx.strokeStyle="#00ffff";

        ctx.lineWidth=2;

        ctx.shadowBlur=15;

        ctx.shadowColor="#00ffff";

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            43,
            0,
            Math.PI*2
        );

        ctx.stroke();

    }

    ctx.restore();

}


/* =========================================================
   PLAYER SHOOTING
========================================================= */

let lastShot=0;


function shoot(){

    const now=Date.now();

    if(
        now-lastShot<
        Math.max(
            65,
            145-power*18
        )
    ){

        return;

    }

    lastShot=now;


    if(power===1){

        bullets.push({

            x:player.x,

            y:player.y-40,

            vx:0,

            vy:-13,

            damage:1

        });

    }


    else if(power===2){

        bullets.push({

            x:player.x-8,

            y:player.y-35,

            vx:-.25,

            vy:-13,

            damage:1

        });


        bullets.push({

            x:player.x+8,

            y:player.y-35,

            vx:.25,

            vy:-13,

            damage:1

        });

    }


    else{

        bullets.push({

            x:player.x,

            y:player.y-42,

            vx:0,

            vy:-14,

            damage:2

        });


        bullets.push({

            x:player.x-12,

            y:player.y-35,

            vx:-1,

            vy:-13,

            damage:1

        });


        bullets.push({

            x:player.x+12,

            y:player.y-35,

            vx:1,

            vy:-13,

            damage:1

        });

    }

}


/* =========================================================
   PLAYER BULLET
========================================================= */

function drawBullet(b){

    ctx.save();

    ctx.strokeStyle="#9cff00";

    ctx.lineWidth=5;

    ctx.shadowBlur=18;

    ctx.shadowColor="#4cff00";

    ctx.beginPath();

    ctx.moveTo(
        b.x,
        b.y+16
    );

    ctx.lineTo(
        b.x,
        b.y-13
    );

    ctx.stroke();


    ctx.strokeStyle="#ffffff";

    ctx.lineWidth=2;

    ctx.beginPath();

    ctx.moveTo(
        b.x,
        b.y+8
    );

    ctx.lineTo(
        b.x,
        b.y-12
    );

    ctx.stroke();

    ctx.restore();

}


/* =========================================================
   ENEMY CREATION
========================================================= */

function addEnemy(
    x,
    y,
    type=0
){

    const difficulty=
        getDifficulty();

    enemies.push({

        x:x,

        y:y,

        type:type,

        hp:difficulty.hp,

        maxHp:difficulty.hp,

        phase:
            Math.random()*
            Math.PI*2,

        vx:
            (Math.random()-.5)*
            (.5+level*.05),

        moveSpeed:
            difficulty.speed,

        shootOffset:
            Math.random()*100

    });

}


/* =========================================================
   LEVEL FORMATIONS
========================================================= */

function createLevel(){

    enemies=[];

    enemyBullets=[];

    powerUps=[];

    boss=null;

    bossActive=false;

    enemyTimer=0;


    if(level===5 || level===10){

        createBoss();

        return;

    }


    const rows=
        Math.min(
            3+
            Math.floor(level/2),
            7
        );


    const columns=
        Math.min(
            4+
            Math.floor(level/2),
            8
        );


    const spacing=
        Math.min(
            72,
            (W-70)/(columns-1)
        );


    for(
        let row=0;
        row<rows;
        row++
    ){

        for(
            let col=0;
            col<columns;
            col++
        ){

            let x;


            if(level%4===1){

                x=
                    W/2-
                    ((columns-1)*
                    spacing)/2+
                    col*spacing;

            }

            else if(level%4===2){

                x=
                    W/2-
                    ((columns-1)*
                    spacing)/2+
                    col*spacing;

                if(row%2===1){

                    x+=spacing/2;

                }

            }

            else if(level%4===3){

                const offset=
                    Math.sin(col)*18;

                x=
                    W/2-
                    ((columns-1)*
                    spacing)/2+
                    col*spacing+
                    offset;

            }

            else{

                const center=
                    (columns-1)/2;

                const distance=
                    Math.abs(
                        col-center
                    );

                x=
                    W/2-
                    ((columns-1)*
                    spacing)/2+
                    col*spacing;

                x+=distance*5;

            }


            const y=
                -100+
                row*65;


            /*
               Higher levels contain
               different enemy types.
            */

            let enemyType;

            if(level<=2){

                enemyType=0;

            }

            else if(level<=4){

                enemyType=
                    col%2;

            }

            else{

                enemyType=
                    (row+col)%3;

            }


            addEnemy(
                x,
                y,
                enemyType
            );

        }

    }

}


/* =========================================================
   ENEMY DRAW
========================================================= */

function drawEnemy(e){

    ctx.save();

    ctx.translate(
        e.x,
        e.y
    );

    e.phase+=.04;


    const bob=
        Math.sin(
            e.phase
        )*3;

    ctx.translate(
        0,
        bob
    );


    let wingColor;

    if(e.type===0){

        wingColor="#ff276e";

    }

    else if(e.type===1){

        wingColor="#8b32ff";

    }

    else{

        wingColor="#ff7900";

    }


    ctx.fillStyle=wingColor;

    ctx.shadowBlur=15;

    ctx.shadowColor=wingColor;


    ctx.beginPath();

    ctx.moveTo(
        -8,
        -4
    );

    ctx.lineTo(
        -35,
        25
    );

    ctx.lineTo(
        -12,
        18
    );

    ctx.closePath();

    ctx.fill();


    ctx.beginPath();

    ctx.moveTo(
        8,
        -4
    );

    ctx.lineTo(
        35,
        25
    );

    ctx.lineTo(
        12,
        18
    );

    ctx.closePath();

    ctx.fill();


    let body=
        ctx.createLinearGradient(
            -18,
            0,
            18,
            0
        );

    body.addColorStop(
        0,
        "#280b52"
    );

    body.addColorStop(
        .4,
        "#e42cff"
    );

    body.addColorStop(
        .5,
        "#fff"
    );

    body.addColorStop(
        .6,
        "#e42cff"
    );

    body.addColorStop(
        1,
        "#280b52"
    );

    ctx.fillStyle=body;

    ctx.beginPath();

    ctx.moveTo(
        0,
        -30
    );

    ctx.lineTo(
        11,
        -7
    );

    ctx.lineTo(
        18,
        22
    );

    ctx.lineTo(
        7,
        17
    );

    ctx.lineTo(
        0,
        30
    );

    ctx.lineTo(
        -7,
        17
    );

    ctx.lineTo(
        -18,
        22
    );

    ctx.lineTo(
        -11,
        -7
    );

    ctx.closePath();

    ctx.fill();


    ctx.fillStyle=
        e.type===2
        ? "#ffdf00"
        : "#55ffff";

    ctx.shadowBlur=15;

    ctx.shadowColor=
        ctx.fillStyle;


    ctx.beginPath();

    ctx.ellipse(
        0,
        -9,
        7,
        11,
        0,
        0,
        Math.PI*2
    );

    ctx.fill();


    /* Strong enemies get armor */

    if(e.maxHp>=4){

        ctx.strokeStyle="#ffcc00";

        ctx.lineWidth=2;

        ctx.shadowBlur=10;

        ctx.shadowColor="#ffcc00";

        ctx.beginPath();

        ctx.arc(
            0,
            0,
            31,
            0,
            Math.PI*2
        );

        ctx.stroke();

    }


    /* HP BAR */

    if(e.hp<e.maxHp){

        ctx.fillStyle=
            "rgba(0,0,0,.6)";

        ctx.fillRect(
            -15,
            -42,
            30,
            4
        );

        ctx.fillStyle="#50ff72";

        ctx.fillRect(
            -15,
            -42,
            30*
            (e.hp/e.maxHp),
            4
        );

    }


    ctx.restore();

}


/* =========================================================
   ENEMY SHOOTING
========================================================= */

let enemyTimer=0;


function enemyShoot(){

    enemyTimer++;

    const difficulty=
        getDifficulty();


    if(
        enemyTimer<
        difficulty.shootDelay
    ){

        return;

    }


    enemyTimer=0;


    if(enemies.length===0){

        return;

    }


    const amount=
        Math.min(
            enemies.length,
            difficulty.shooters
        );


    const shuffled=
        [...enemies].sort(
            ()=>Math.random()-.5
        );


    for(
        let i=0;
        i<amount;
        i++
    ){

        const e=
            shuffled[i];


        const dx=
            player.x-e.x;

        const dy=
            player.y-e.y;


        const angle=
            Math.atan2(
                dy,
                dx
            );


        /*
           Higher levels have
           slightly more accurate shots.
        */

        const spread=
            level>=6
            ? (Math.random()-.5)*.15
            : (Math.random()-.5)*.06;


        const finalAngle=
            angle+spread;


        const speed=
            difficulty.bulletSpeed;


        enemyBullets.push({

            x:e.x,

            y:e.y+20,

            vx:
                Math.cos(finalAngle)*
                speed,

            vy:
                Math.sin(finalAngle)*
                speed

        });

    }

}


/* =========================================================
   ENEMY BULLET
========================================================= */

function drawEnemyBullet(b){

    ctx.save();

    ctx.fillStyle="#ffeb00";

    ctx.shadowBlur=18;

    ctx.shadowColor="#ff7300";


    ctx.beginPath();

    ctx.arc(
        b.x,
        b.y,
        5,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.strokeStyle=
        "rgba(255,160,0,.5)";

    ctx.lineWidth=3;

    ctx.beginPath();

    ctx.moveTo(
        b.x-b.vx*3,
        b.y-b.vy*3
    );

    ctx.lineTo(
        b.x,
        b.y
    );

    ctx.stroke();


    ctx.restore();

}


/* =========================================================
   POWER UPS
========================================================= */

function createPowerUp(
    x,
    y
){

    powerUps.push({

        x:x,

        y:y,

        speed:2,

        type:
            Math.random()<.75
            ? "power"
            : "life"

    });

}


function drawPowerUp(p){

    ctx.save();

    ctx.translate(
        p.x,
        p.y
    );

    ctx.shadowBlur=20;

    ctx.shadowColor=
        p.type==="power"
        ? "#00ffcc"
        : "#ff315d";


    ctx.fillStyle=
        p.type==="power"
        ? "#00ffd5"
        : "#ff315d";


    ctx.beginPath();

    ctx.arc(
        0,
        0,
        14,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.fillStyle="#fff";

    ctx.font=
        "bold 16px Arial";

    ctx.textAlign="center";

    ctx.textBaseline="middle";


    ctx.fillText(
        p.type==="power"
        ? "P"
        : "♥",
        0,
        1
    );


    ctx.restore();

}


/* =========================================================
   BOSS
========================================================= */

function createBoss(){

    bossActive=true;


    boss={

        x:W/2,

        y:-120,

        hp:
            level===10
            ? 350
            : 160,

        maxHp:
            level===10
            ? 350
            : 160,

        vx:
            level===10
            ? 1.5
            : 1.2,

        timer:0

    };

}


/* =========================================================
   BOSS DRAW
========================================================= */

function drawBoss(){

    if(!boss){

        return;

    }


    ctx.save();

    ctx.translate(
        boss.x,
        boss.y
    );


    const pulse=
        Math.sin(
            Date.now()*.005
        )*3;


    ctx.fillStyle="#6a08b8";

    ctx.shadowBlur=25;

    ctx.shadowColor="#d000ff";


    ctx.beginPath();

    ctx.moveTo(
        -25,
        -20
    );

    ctx.lineTo(
        -125,
        60
    );

    ctx.lineTo(
        -60,
        48
    );

    ctx.lineTo(
        -25,
        30
    );

    ctx.closePath();

    ctx.fill();


    ctx.beginPath();

    ctx.moveTo(
        25,
        -20
    );

    ctx.lineTo(
        125,
        60
    );

    ctx.lineTo(
        60,
        48
    );

    ctx.lineTo(
        25,
        30
    );

    ctx.closePath();

    ctx.fill();


    let body=
        ctx.createLinearGradient(
            -50,
            0,
            50,
            0
        );

    body.addColorStop(
        0,
        "#240047"
    );

    body.addColorStop(
        .3,
        "#a800ff"
    );

    body.addColorStop(
        .5,
        "#fff"
    );

    body.addColorStop(
        .7,
        "#a800ff"
    );

    body.addColorStop(
        1,
        "#240047"
    );


    ctx.fillStyle=body;


    ctx.beginPath();

    ctx.moveTo(
        0,
        -80
    );

    ctx.lineTo(
        35,
        -30
    );

    ctx.lineTo(
        55,
        55
    );

    ctx.lineTo(
        20,
        42
    );

    ctx.lineTo(
        0,
        70
    );

    ctx.lineTo(
        -20,
        42
    );

    ctx.lineTo(
        -55,
        55
    );

    ctx.lineTo(
        -35,
        -30
    );

    ctx.closePath();

    ctx.fill();


    ctx.fillStyle="#ff3a58";

    ctx.shadowBlur=30;

    ctx.shadowColor="#ff0000";


    ctx.beginPath();

    ctx.arc(
        0,
        -20,
        22+pulse,
        0,
        Math.PI*2
    );

    ctx.fill();


    ctx.shadowBlur=0;

    ctx.fillStyle=
        "rgba(0,0,0,.7)";

    ctx.fillRect(
        -110,
        -105,
        220,
        12
    );


    ctx.fillStyle="#ff315d";

    ctx.fillRect(
        -110,
        -105,
        220*
        (boss.hp/boss.maxHp),
        12
    );


    ctx.restore();

}


/* =========================================================
   BOSS SHOOTING
========================================================= */

function bossShoot(){

    if(!boss){

        return;

    }


    boss.timer++;


    const delay=
        level===10
        ? 28
        : 40;


    if(boss.timer<delay){

        return;

    }


    boss.timer=0;


    const speed=
        level===10
        ? 3.8
        : 3.2;


    /*
       Boss spread
    */

    const spread=
        level===10
        ? 6
        : 4;


    for(
        let i=-spread;
        i<=spread;
        i++
    ){

        const angle=
            Math.PI/2+
            i*.12;


        enemyBullets.push({

            x:boss.x,

            y:boss.y+50,

            vx:
                Math.cos(angle)*
                speed,

            vy:
                Math.sin(angle)*
                speed

        });

    }


    /*
       Level 10 has an extra
       player-targeting attack.
    */

    if(level===10){

        for(
            let i=0;
            i<7;
            i++
        ){

            const angle=
                Math.atan2(
                    player.y-boss.y,
                    player.x-boss.x
                )+
                (i-3)*.07;


            enemyBullets.push({

                x:boss.x,

                y:boss.y+40,

                vx:
                    Math.cos(angle)*5,

                vy:
                    Math.sin(angle)*5

            });

        }

    }

}


/* =========================================================
   EXPLOSION
========================================================= */

function explode(
    x,
    y,
    amount=25
){

    for(
        let i=0;
        i<amount;
        i++
    ){

        const a=
            Math.random()*
            Math.PI*2;


        const speed=
            Math.random()*6+1;


        particles.push({

            x:x,

            y:y,

            vx:
                Math.cos(a)*
                speed,

            vy:
                Math.sin(a)*
                speed,

            life:
                25+
                Math.random()*45,

            size:
                Math.random()*5+1

        });

    }

}


/* =========================================================
   PARTICLES
========================================================= */

function drawParticles(){

    for(
        let i=particles.length-1;
        i>=0;
        i--
    ){

        const p=
            particles[i];


        p.x+=p.vx;

        p.y+=p.vy;

        p.vx*=.97;

        p.vy*=.97;

        p.life--;


        ctx.globalAlpha=
            Math.max(
                0,
                p.life/60
            );


        ctx.fillStyle=
            p.life%2
            ? "#ffff00"
            : "#ff5a00";


        ctx.shadowBlur=12;

        ctx.shadowColor=
            ctx.fillStyle;


        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            p.size,
            0,
            Math.PI*2
        );

        ctx.fill();


        if(p.life<=0){

            particles.splice(
                i,
                1
            );

        }

    }


    ctx.globalAlpha=1;

    ctx.shadowBlur=0;

}


/* =========================================================
   COLLISION
========================================================= */

function hit(
    a,
    b,
    distance
){

    return Math.hypot(
        a.x-b.x,
        a.y-b.y
    )<distance;

}


/* =========================================================
   UPDATE
========================================================= */

function update(){

    if(!running){

        return;

    }


    /* ================= PLAYER ================= */

    if(
        keys.ArrowLeft||
        keys.a||
        left
    ){

        player.x-=
            player.speed;

    }


    if(
        keys.ArrowRight||
        keys.d||
        right
    ){

        player.x+=
            player.speed;

    }


    player.x=
        Math.max(
            30,
            Math.min(
                W-30,
                player.x
            )
        );


    if(
        keys[" "]||
        fire
    ){

        shoot();

    }


    if(
        player.invincible>0
    ){

        player.invincible--;

    }


    /* ================= PLAYER BULLETS ================= */

    for(
        let i=bullets.length-1;
        i>=0;
        i--
    ){

        const b=
            bullets[i];


        b.x+=b.vx;

        b.y+=b.vy;


        if(
            b.y<-30||
            b.x<-30||
            b.x>W+30
        ){

            bullets.splice(
                i,
                1
            );

        }

    }


    /* ================= ENEMIES ================= */

    enemies.forEach(e=>{

        /*
           Level-specific speed
        */

        e.y+=e.moveSpeed;


        /*
           Side movement
        */

        e.x+=e.vx;


        /*
           Keep enemies inside arena
        */

        if(
            e.x<35||
            e.x>W-35
        ){

            e.vx*=-1;

        }


        /*
           Higher levels get
           slightly more movement.
        */

        if(level>=4){

            e.x+=
                Math.sin(
                    Date.now()*.002+
                    e.phase
                )*.35;

        }

    });


    enemyShoot();


    /* ================= ENEMY BULLETS ================= */

    for(
        let i=enemyBullets.length-1;
        i>=0;
        i--
    ){

        const b=
            enemyBullets[i];


        b.x+=b.vx;

        b.y+=b.vy;


        if(
            b.y>H+40||
            b.x<-50||
            b.x>W+50
        ){

            enemyBullets.splice(
                i,
                1
            );

            continue;

        }


        if(
            player.invincible<=0&&
            hit(
                b,
                player,
                23
            )
        ){

            enemyBullets.splice(
                i,
                1
            );


            lives--;

            player.invincible=100;


            explode(
                player.x,
                player.y,
                35
            );


            if(
                lives<=0
            ){

                gameOver();

            }

        }

    }


    /* ================= BULLET VS ENEMY ================= */

    for(
        let bi=bullets.length-1;
        bi>=0;
        bi--
    ){

        const b=
            bullets[bi];


        for(
            let ei=enemies.length-1;
            ei>=0;
            ei--
        ){

            const e=
                enemies[ei];


            if(
                hit(
                    b,
                    e,
                    28
                )
            ){

                e.hp-=b.damage;


                bullets.splice(
                    bi,
                    1
                );


                explode(
                    e.x,
                    e.y,
                    8
                );


                if(e.hp<=0){

                    score+=
                        100+
                        level*20;


                    if(
                        Math.random()<.12
                    ){

                        createPowerUp(
                            e.x,
                            e.y
                        );

                    }


                    explode(
                        e.x,
                        e.y,
                        30
                    );


                    enemies.splice(
                        ei,
                        1
                    );

                }


                break;

            }

        }

    }


    /* ================= BOSS ================= */

    if(boss){

        if(
            boss.y<120
        ){

            boss.y+=1.2;

        }

        else{

            boss.x+=boss.vx;

        }


        if(
            boss.x>W-120||
            boss.x<120
        ){

            boss.vx*=-1;

        }


        bossShoot();


        for(
            let i=bullets.length-1;
            i>=0;
            i--
        ){

            const b=
                bullets[i];


            if(
                hit(
                    b,
                    boss,
                    65
                )
            ){

                boss.hp-=b.damage;


                bullets.splice(
                    i,
                    1
                );


                explode(
                    b.x,
                    b.y,
                    5
                );


                if(
                    boss.hp<=0
                ){

                    score+=
                        level*2000;


                    explode(
                        boss.x,
                        boss.y,
                        180
                    );


                    boss=null;

                    bossActive=false;


                    setTimeout(
                        nextLevel,
                        1200
                    );

                }

            }

        }

    }


    /* ================= ENEMIES REACH BOTTOM ================= */

    for(
        let i=enemies.length-1;
        i>=0;
        i--
    ){

        const e=
            enemies[i];


        if(
            e.y>H+50
        ){

            enemies.splice(
                i,
                1
            );


            lives--;


            explode(
                player.x,
                player.y,
                20
            );


            if(
                lives<=0
            ){

                gameOver();

            }

        }

    }


    /* ================= POWER UPS ================= */

    for(
        let i=powerUps.length-1;
        i>=0;
        i--
    ){

        const p=
            powerUps[i];


        p.y+=p.speed;


        if(
            p.y>H+30
        ){

            powerUps.splice(
                i,
                1
            );

            continue;

        }


        if(
            hit(
                p,
                player,
                28
            )
        ){

            if(
                p.type==="power"
            ){

                power=
                    Math.min(
                        3,
                        power+1
                    );

                score+=500;

            }

            else{

                lives=
                    Math.min(
                        5,
                        lives+1
                    );

            }


            powerUps.splice(
                i,
                1
            );

        }

    }


    /* ================= LEVEL COMPLETE ================= */

    if(
        !bossActive&&
        enemies.length===0&&
        !boss&&
        !transitioning
    ){

        nextLevel();

    }

}


/* =========================================================
   NEXT LEVEL
========================================================= */

function nextLevel(){

    if(transitioning){

        return;

    }


    transitioning=true;


    level++;


    if(level>10){

        winGame();

        return;

    }


    showLevel();


    setTimeout(
        ()=>{

            createLevel();

            transitioning=false;

        },
        1700
    );

}


/* =========================================================
   LEVEL SCREEN
========================================================= */

function showLevel(){

    const screen=
        document.getElementById(
            "levelScreen"
        );


    const text=
        document.getElementById(
            "levelText"
        );


    const bossText=
        document.getElementById(
            "bossText"
        );


    const description=
        document.getElementById(
            "levelDescription"
        );


    text.textContent=
        "LEVEL "+level;


    const descriptions={

        1:"Easy — Slow enemy fleet",

        2:"Enemy fleet getting stronger",

        3:"Armored enemies incoming",

        4:"Aggressive enemy pilots",

        5:"⚠️ BOSS — Heavy enemy fire",

        6:"Elite alien fighters",

        7:"Heavy enemy fire incoming",

        8:"⚠️ EXTREME — Fast alien fleet",

        9:"⚠️ NIGHTMARE — Very aggressive enemies",

        10:"☠️ FINAL BATTLE — MAXIMUM DIFFICULTY"

    };


    if(
        level===5||
        level===10
    ){

        bossText.textContent=
            "⚠️ BOSS BATTLE ⚠️";

    }

    else{

        bossText.textContent="";

    }


    description.textContent=
        descriptions[level]||
        "Enemy fleet incoming...";


    screen.classList.remove(
        "hidden"
    );


    setTimeout(
        ()=>{

            screen.classList.add(
                "hidden"
            );

        },
        1500
    );

}


/* =========================================================
   HUD
========================================================= */

function drawHUD(){

    ctx.save();


    ctx.fillStyle=
        "rgba(0,0,20,.55)";

    ctx.fillRect(
        0,
        0,
        W,
        62
    );


    ctx.fillStyle="#fff";

    ctx.font=
        "bold 15px Arial";


    ctx.textAlign="left";


    ctx.fillText(
        "SCORE",
        12,
        20
    );


    ctx.fillText(
        score.toLocaleString(),
        12,
        42
    );


    ctx.textAlign="center";


    ctx.fillText(
        "LEVEL "+level,
        W/2,
        24
    );


    ctx.fillText(
        "POWER "+power,
        W/2,
        45
    );


    ctx.textAlign="right";


    ctx.fillText(
        "❤️ ".repeat(lives),
        W-12,
        28
    );


    if(boss){

        ctx.fillStyle=
            "rgba(0,0,0,.7)";

        ctx.fillRect(
            40,
            70,
            W-80,
            9
        );


        ctx.fillStyle="#ff315d";

        ctx.fillRect(
            40,
            70,
            (W-80)*
            (boss.hp/boss.maxHp),
            9
        );

    }


    ctx.restore();

}


/* =========================================================
   DRAW
========================================================= */

function draw(){

    drawBackground();


    enemies.forEach(
        drawEnemy
    );


    if(boss){

        drawBoss();

    }


    bullets.forEach(
        drawBullet
    );


    enemyBullets.forEach(
        drawEnemyBullet
    );


    powerUps.forEach(
        drawPowerUp
    );


    if(
        player.invincible===0||
        Math.floor(
            player.invincible/6
        )%2===0
    ){

        drawPlayer();

    }


    drawParticles();

    drawHUD();

}


/* =========================================================
   GAME LOOP
========================================================= */

function loop(){

    update();

    draw();

    requestAnimationFrame(
        loop
    );

}


/* =========================================================
   START GAME
========================================================= */

function startGame(){

    level=1;

    score=0;

    lives=3;

    power=1;

    enemyTimer=0;

    transitioning=false;

    bullets=[];

    enemyBullets=[];

    particles=[];

    powerUps=[];

    enemies=[];

    boss=null;

    bossActive=false;

    player.invincible=0;

    player.x=W/2;

    player.y=H-110;

    running=true;


    document
        .getElementById(
            "startScreen"
        )
        .classList.add(
            "hidden"
        );


    document
        .getElementById(
            "gameOverScreen"
        )
        .classList.add(
            "hidden"
        );


    document
        .getElementById(
            "winScreen"
        )
        .classList.add(
            "hidden"
        );


    showLevel();


    setTimeout(
        ()=>{
            createLevel();
        },
        1500
    );

}


/* =========================================================
   GAME OVER
========================================================= */

function gameOver(){

    if(!running){

        return;

    }


    running=false;


    document
        .getElementById(
            "finalScore"
        )
        .textContent=
        "Score: "+
        score.toLocaleString();


    document
        .getElementById(
            "finalLevel"
        )
        .textContent=
        "Reached Level: "+
        level;


    document
        .getElementById(
            "gameOverScreen"
        )
        .classList.remove(
            "hidden"
        );

}


/* =========================================================
   WIN
========================================================= */

function winGame(){

    running=false;

    transitioning=false;


    document
        .getElementById(
            "winScore"
        )
        .textContent=
        "Final Score: "+
        score.toLocaleString();


    document
        .getElementById(
            "winScreen"
        )
        .classList.remove(
            "hidden"
        );

}


/* =========================================================
   KEYBOARD
========================================================= */

document.addEventListener(
    "keydown",
    e=>{

        keys[e.key]=true;


        if(
            e.code==="Space"
        ){

            keys[" "]=true;

            e.preventDefault();

        }

    }
);


document.addEventListener(
    "keyup",
    e=>{

        keys[e.key]=false;


        if(
            e.code==="Space"
        ){

            keys[" "]=false;

        }

    }
);


/* =========================================================
   MOUSE
========================================================= */

canvas.addEventListener(
    "mousemove",
    e=>{

        if(!running){

            return;

        }


        const rect=
            canvas.getBoundingClientRect();


        player.x=
            e.clientX-
            rect.left;

    }
);


canvas.addEventListener(
    "mousedown",
    ()=>{

        fire=true;

    }
);


document.addEventListener(
    "mouseup",
    ()=>{

        fire=false;

    }
);


/* =========================================================
   TOUCH
========================================================= */

canvas.addEventListener(
    "touchmove",
    e=>{

        e.preventDefault();


        if(!running){

            return;

        }


        const rect=
            canvas.getBoundingClientRect();


        player.x=
            e.touches[0].clientX-
            rect.left;


        shoot();

    },
    {
        passive:false
    }
);


/* =========================================================
   MOBILE BUTTONS
========================================================= */

function buttonControl(
    element,
    start,
    end
){

    element.addEventListener(
        "touchstart",
        e=>{

            e.preventDefault();

            start();

        }
    );


    element.addEventListener(
        "touchend",
        e=>{

            e.preventDefault();

            end();

        }
    );


    element.addEventListener(
        "mousedown",
        start
    );


    element.addEventListener(
        "mouseup",
        end
    );


    element.addEventListener(
        "mouseleave",
        end
    );

}


buttonControl(
    document.getElementById("left"),
    ()=>left=true,
    ()=>left=false
);


buttonControl(
    document.getElementById("right"),
    ()=>right=true,
    ()=>right=false
);


buttonControl(
    document.getElementById("fire"),
    ()=>fire=true,
    ()=>fire=false
);


/* =========================================================
   BUTTONS
========================================================= */

document
    .getElementById("startBtn")
    .onclick=
    startGame;


document
    .getElementById("restartBtn")
    .onclick=
    startGame;


document
    .getElementById("winRestart")
    .onclick=
    startGame;


/* =========================================================
   INITIALIZE
========================================================= */

resize();

createStars();

loop();

</script>
